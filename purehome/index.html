<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PURE HOME Ostrava · Prémiový úklid domácností</title>
<meta name="description" content="Prémiový úklid domácností v Ostravě a okolí. Uklízí Ivana osobně, s vlastním vybavením a šetrnými prostředky. Cenu znáte předem.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E5E1D9">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/img/light-window.webp" type="image/webp" media="(min-width: 821px)">
<link rel="preload" as="image" href="assets/img/light-window-m.webp" type="image/webp" media="(max-width: 820px)">
<link rel="stylesheet" href="assets/css/style.css?v=9">
<script>
  (function (d) {
    var h = d.documentElement; h.classList.add('js');
    try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) h.classList.add('rm'); } catch (e) {}
    try { if (sessionStorage.getItem('ph3-intro')) h.classList.add('seen'); } catch (e) {}
  })(document);
</script>
</head>
<body>
<a class="skip" href="#den">Přeskočit na obsah</a>

<header class="hdr" data-theme="light">
  <div class="hdr__in">
    <a class="hdr__logo" href="#uvod" aria-label="PURE HOME Ostrava, zpět na začátek">
      <img class="hdr__logo-ink" src="assets/img/logo-word.svg" alt="" width="1080" height="196">
      <img class="hdr__logo-white" src="assets/img/logo-word-white.svg" alt="" width="1080" height="196">
    </a>
    <nav class="hdr__nav" aria-label="Hlavní menu" data-render="nav"></nav>
    <a class="btn btn--sm hdr__cta" href="#rezervace">Rezervovat úklid</a>
    <button class="hdr__menu" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  </div>
</header>

<div class="menu" id="menu" hidden>
  <nav class="menu__nav" aria-label="Menu" data-render="menu"></nav>
  <div class="menu__foot" data-render="menu-foot"></div>
</div>

<main id="obsah">

  <!-- 1 · Úvod a jeden den s PURE HOME: slunce putuje po stěně od rána do večera -->
  <section class="day" id="uvod" aria-label="Úvod a jak to probíhá">
    <div class="day__pin">
      <div class="wall" aria-hidden="true">
        <div class="wall__light"><i class="wall__sun"></i><i class="wall__gold"></i></div>
        <div class="wall__leaves"></div>
        <div class="wall__warm"></div>
        <div class="wall__vign"></div>
      </div>

      <div class="hero" data-render="hero">
        <div class="hero__in">
          <h1 class="hero__logo"><span class="sr">PURE HOME Ostrava</span><span class="hero__mark" aria-hidden="true"></span></h1>
          <p class="hero__tag"></p>
          <p class="hero__title"></p>
          <p class="hero__lead"></p>
          <div class="hero__cta"></div>
        </div>
      </div>
      <p class="hero__cue" aria-hidden="true"><span>Jak to probíhá</span><i></i></p>

      <div class="story" id="den" data-render="story"></div>
    </div>
  </section>

  <!-- 2 · Ivana -->
  <section class="iva sec" id="iva" aria-labelledby="iva-t" data-render="iva"></section>

  <!-- 3 · Služby -->
  <section class="services sec" id="sluzby" aria-labelledby="sluzby-t" data-render="services"></section>

  <!-- 4 · Co přesně uděláme -->
  <section class="scope sec" id="rozsah" aria-labelledby="rozsah-t" data-render="scope"></section>

  <!-- 5 · Vybavení -->
  <section class="gear sec" id="vybaveni" aria-labelledby="vybaveni-t" data-render="gear"></section>

  <!-- 6 · Šetrné prostředky -->
  <section class="shelf" id="prostredky" aria-labelledby="prostredky-t">
    <div class="shelf__pin">
      <div class="shelf__head" data-render="shelf-head"></div>
      <div class="shelf__stage">
        <ul class="shelf__track" data-render="shelf"></ul>
      </div>
      <div class="shelf__info" data-render="shelf-info" aria-live="polite"></div>
      <div class="shelf__bar" aria-hidden="true"><i></i></div>
    </div>
  </section>

  <!-- 6 · Rezervace s kalendářem -->
  <section class="order sec" id="rezervace" aria-labelledby="rezervace-t" data-render="order"></section>

  <!-- 7 · Pravidla -->
  <section class="rules sec" id="pravidla" aria-labelledby="pravidla-t" data-render="rules"></section>

  <!-- 8 · Kontakt -->
  <section class="contact sec" id="kontakt" aria-labelledby="kontakt-t" data-render="contact"></section>

</main>

<footer class="ftr" data-render="footer"></footer>

<div class="mbar" data-render="mbar" hidden></div>
<p class="badge" data-render="badge"></p>
<div class="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data.js?v=9"></script>
<script src="assets/js/logo-data.js?v=9"></script>
<script src="assets/js/core.js?v=9"></script>
<script src="assets/js/day.js?v=9"></script>
<script src="assets/js/shelf.js?v=9"></script>
<script src="assets/js/booking.js?v=9"></script>
<script src="assets/js/order.js?v=9"></script>
<script src="assets/js/home.js?v=9"></script>
</body>
</html>
